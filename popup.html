<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>下载守护</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <img class="logo" src="icons/icon48.png" alt="" width="28" height="28" />
      <div class="head-text">
        <h1>下载守护</h1>
        <p id="summary">正在加载…</p>
      </div>
      <button id="btn-options" class="icon-btn" title="设置">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5Zm8.9-2.6a7.9 7.9 0 0 0 0-1.8l2-1.5-2-3.4-2.3 1a7.6 7.6 0 0 0-1.6-.9L16.6 4h-4l-.4 2.3a7.6 7.6 0 0 0-1.6.9l-2.3-1-2 3.4 2 1.5a7.9 7.9 0 0 0 0 1.8l-2 1.5 2 3.4 2.3-1a7.6 7.6 0 0 0 1.6.9l.4 2.3h4l.4-2.3a7.6 7.6 0 0 0 1.6-.9l2.3 1 2-3.4Z"
          />
        </svg>
      </button>
    </header>

    <div id="notice" class="notice" hidden>
      <span id="notice-text"></span>
      <button id="notice-action" class="link-btn" hidden>去设置</button>
    </div>

    <nav class="filters" id="filters">
      <button class="chip is-active" data-filter="all">全部 <b id="c-all">0</b></button>
      <button class="chip" data-filter="threat">危险 <b id="c-threat">0</b></button>
      <button class="chip" data-filter="clean">安全 <b id="c-clean">0</b></button>
    </nav>

    <main id="list" class="list"></main>

    <div id="empty" class="empty" hidden>
      <img src="icons/icon48.png" alt="" width="44" height="44" />
      <p>还没有下载记录</p>
      <span>下载任意文件后，这里会自动显示哈希与查毒结果</span>
    </div>

    <footer class="foot">
      <span id="foot-note">仅哈希值会发送到 VirusTotal，文件内容不出本机</span>
    </footer>

    <div id="toast" class="toast" hidden></div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
